<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In</title>
    <style>
        label, input {
            display: block;
        }

        input {
            font-size: 20px;
            padding: 5px 5px;
            border-radius: 7px;
            border: 1px solid #ccc;
            box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.075);
            margin-bottom: 5px;
            width: 40%;
        }

        label {
            margin-bottom: 3px;
            font-size: larger;
        }

        button {
            margin-top: 5px;
            padding: 8px 15px;
            color: white;
            font-weight: bold;
            border: none;
            background-color: #ffa400;
            cursor: pointer;
            border-radius: 4px;
            transition: opacity 0.1s;
        }
        button:hover {
            opacity: 0.8;
        }
        button:active {
            opacity: 0.5;
        }
    </style>
</head>
<body>
  <main>
    <h1>Log In</h1>
    <form action="#" method="post">
      <fieldset>
        <legend>Login</legend>

        <!-- Username Field -->
          <label for="username">Username:</label>
          <input type="text" name="username" id="username" placeholder="Username" required>

        <!-- Password Field -->
          <label for="password">Password:</label>
          <input type="password" name="password" id="password" placeholder="Password" required>

        <!-- Log In Button -->
          <button type="submit">Log In</button>
      </fieldset>
    </form>
  </main>
</body>
</html>
