<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product List Page</title>

  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 5px;
      text-align: center;
    }

    caption {
      caption-side: bottom;
    }

    button {
      border: none;
      background-color: #008cff;
      padding: 8px 15px;
      border-radius: 8px;
      color: white;
      transition: opacity 0.2s ease;
      font-weight: bold;
      font-size: 14px;
    }
    button:hover {
      opacity: 0.8;
    }
    button:active {
      opacity: 0.5;
    }

    input, label {
      display: block;
    }
    input {
      width: 40%;
      padding: 6px 8px;
      border-radius: 4px;
      border-color: rgb(200, 200, 200);
      margin-bottom: 10px;
    }

    label {
      font-weight: lighter;
      font-size: 16px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <main>
    <article>
      <h1>Products Page</h1>
      <!-- use case 1: display the list of products on the page. -->
      <section id="product-list">
        <h2>List of Products</h2>
        <table>
          <caption>Products List</caption>
          <thead>
          <tr>
            <th>NAME</th>
            <th>PRICE</th>
          </tr>
          </thead>
          <tbody>
          <!-- For each product in products -->
          <tr th:each="product : ${products}">
            <td th:text="${product.name}"></td>
            <td th:text="${product.price}"></td>
          </tr>
          </tbody>
        </table>
      </section>
      <br><br><hr>

      <!-- use case 2: add a product to the list of products. -->
      <section id="add-product">
        <h2>Add a Product</h2>
        <form action="#" method="post">
          <fieldset>
            <legend>Add Product</legend>

            <!-- Name of the product -->
            <label for="prod-name">Name</label>
            <input type="text" id="prod-name" name="name" placeholder="Product Name" required>

            <!-- Price of the product -->
            <label for="prod-price">Price</label>
            <input type="number" id="prod-price" name="price" step="any" min="0" placeholder="Product Price" required>

            <!-- Submit the data to the server. -->
            <button type="submit">Add Product</button>
          </fieldset>
        </form>
      </section>
    </article>
  </main>
</body>
</html>
