<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log In Page</title>
    <style>
        input, label {
            display: block;
        }
        input {
            margin-bottom: 10px;
        }

        button {
            border: none;
            color: white;
            background-color: #00ba00;
            padding: 10px 18px;
            border-radius: 14px;
            font-weight: bold;
            transition: opacity 0.3s ease;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.7;
        }
        button:active {
            opacity: 0.4;
        }

        form input {
            font-size: 20px;
            width: 40%;
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid #5c5c5c;
        }
    </style>
</head>
<body>
    <main>
        <h1>Log In</h1>
        <article>
            <section id="login-form">
                <form action="#" method="post">
                    <fieldset>
                        <legend>Login</legend>

                        <!-- Username -->
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" placeholder="Username" required>

                        <!-- Password -->
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" placeholder="Password" required>

                        <!-- Submit -->
                        <button type="submit">Log In</button>
                    </fieldset>
                </form>
            </section>

            <section id="response">
                <p th:text="${message}">

                </p>
            </section>
        </article>
    </main>
</body>
</html>
